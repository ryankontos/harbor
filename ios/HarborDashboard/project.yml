name: HarborDashboard
options:
  defaultConfig: Debug
packages: {}
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: dev.harbor.dashboard
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: 6.0
targets:
  HarborDashboard:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - Info-macOS.plist
          - HarborDashboard.entitlements
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_NAME: HarborDashboard
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    info:
      path: Resources/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - remote-notification
        UIUserInterfaceStyle: Light
    entitlements:
      path: Resources/HarborDashboard.entitlements
      properties:
        aps-environment: development
    scheme:
      testTargets: []
  HarborDashboardMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - Info.plist
          - HarborDashboard.entitlements
    settings:
      base:
        INFOPLIST_FILE: Resources/Info-macOS.plist
        PRODUCT_BUNDLE_IDENTIFIER: dev.harbor.dashboard.mac
        PRODUCT_NAME: HarborDashboard Mac
        CODE_SIGN_STYLE: Automatic
    info:
      path: Resources/Info-macOS.plist
      properties:
        LSApplicationCategoryType: public.app-category.utilities
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticGraphicsSwitching: true
    scheme:
      testTargets: []
